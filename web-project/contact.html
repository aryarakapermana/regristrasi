<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Campus Life</title>
</head>
<body>

<header>
  <h1>Campus Life</h1>
  <p>Portal informasi dan kegiatan mahasiswa</p>
</header>

<nav aria-label="Navigasi utama">
  <a href="index.html">Home</a>
  <a href="registration.html">Registration</a>
  <a href="contact.html" aria-current="page">Contact</a>
</nav>

<main>
  <section aria-labelledby="judul-kontak">
    <h2 id="judul-kontak">Contact Form</h2>
    <p>Hubungi pengelola Campus Life. Kolom bertanda * wajib diisi.</p>

    <form action="#" method="post">
      <div>
        <label for="name">Nama Lengkap *</label>
        <input type="text" id="name" name="name" autocomplete="name" minlength="3" required>
      </div>

      <div>
        <label for="email">Email *</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>

      <fieldset>
        <legend>Jenis Layanan *</legend>
        <label>
          <input type="radio" name="service" value="information" required>
          Informasi
        </label>
        <label>
          <input type="radio" name="service" value="complaint">
          Pengaduan
        </label>
      </fieldset>

      <div>
        <label for="message">Pesan *</label>
        <textarea id="message" name="message" rows="5" minlength="10" required></textarea>
      </div>

      <div>
        <button type="submit">Kirim</button>
        <button type="reset">Reset</button>
      </div>
    </form>
  </section>
</main>

<footer>
  <p>&copy; 2026 Campus Life</p>
</footer>

</body>
</html>
